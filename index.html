<!doctype html>
<html lang="en" class="windows-app">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <title>Firefly — Your music, illuminated</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-albums" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16M11 8h6M11 12h6M11 16h4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></symbol>
    <symbol id="i-artist" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="i-song" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 9l11-2"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-playlist" viewBox="0 0 24 24"><path d="M4 6h10M4 11h10M4 16h6M18 14v-3m0 3v3m0-3h-3m3 0h3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.36.34.7.6 1 .3.3.68.4 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.7.6Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-shelf" viewBox="0 0 24 24"><path d="M3 20h18M5 20V6h4v14M10 20V4h4v16M15 20V8h4v12"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5L12 2Z"/><path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="fill" d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path class="fill" d="M7 5h4v14H7zM14 5h4v14h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path class="fill" d="M6 5h2v14H6zM19 5 9 12l10 7V5Z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path class="fill" d="M16 5h2v14h-2zM5 5l10 7-10 7V5Z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3c4 0 6 10 10 10h3m0 0-3-3m3 3-3 3M4 17h3c1.3 0 2.4-1 3.4-2.4M14 8.5C15 7.6 16 7 17 7h3m0 0-3-3m3 3-3 3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path class="fill" d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9c1.5 1.7 1.5 4.3 0 6m2.5-8.5c3 3 3 8 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path class="fill" d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m16 9 5 6m0-6-5 6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle class="fill" cx="5" cy="12" r="1.5"/><circle class="fill" cx="12" cy="12" r="1.5"/><circle class="fill" cx="19" cy="12" r="1.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 17 5-4 4 3 3-3 4 4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M8 6 9.5 4h5L16 6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-suno" viewBox="0 0 24 24"><path d="M4 16c2.5-8 5 8 8 0s5.5 8 8 0M4 10c2.5-8 5 8 8 0s5.5 8 8 0"/></symbol>
  </svg>

  <div class="ambient"><i></i><i></i><i></i></div>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" id="brandHome" aria-label="Open Firefly Home">
        <span class="brand-firefly" aria-hidden="true">
          <img class="firefly-layer firefly-left-wing" src="assets/firefly-logo.png" alt="">
          <img class="firefly-layer firefly-right-wing" src="assets/firefly-logo.png" alt="">
          <img class="firefly-layer firefly-body" src="assets/firefly-logo.png" alt="">
          <i class="firefly-aura"></i>
        </span>
        <span>firefly</span>
      </button>
      <nav class="nav-primary" id="primaryNav">
        <button class="active" data-view="home"><svg><use href="#i-home"/></svg><span>Home</span></button>
        <button data-view="playlists"><svg><use href="#i-playlist"/></svg><span>Playlists</span></button>
        <button data-view="artists"><svg><use href="#i-artist"/></svg><span>Artists</span></button>
        <button data-view="albums"><svg><use href="#i-albums"/></svg><span>Albums</span><em id="albumCount">8</em></button>
        <button data-view="songs"><svg><use href="#i-song"/></svg><span>Songs</span><em id="songCount">42</em></button>
      </nav>
      <div class="sidebar-section">
        <div class="section-label"><span>YOUR PLAYLISTS</span><button data-action="new-playlist"><svg><use href="#i-plus"/></svg></button></div>
        <div class="mini-playlists" id="miniPlaylists"></div>
      </div>
      <div class="sidebar-bottom">
        <button class="update-widget idle" id="updateWidget" aria-label="Updates"><svg><use href="#i-upload"/></svg><span><b>Updates</b><small>Stable · main</small></span><i></i></button>
        <button data-view="suno"><svg><use href="#i-suno"/></svg><span>Suno Studio</span><i class="beta">BETA</i></button>
        <button data-view="settings"><svg><use href="#i-settings"/></svg><span>Settings</span></button>
      </div>
    </aside>

    <main class="content" id="content">
      <header class="topbar">
        <div class="history"><button aria-label="Back">‹</button><button aria-label="Forward">›</button></div>
        <label class="search"><svg><use href="#i-search"/></svg><input id="searchInput" placeholder="Search your library" /><kbd>Ctrl K</kbd></label>
        <div class="top-actions">
          <button class="ghost shelf-trigger" id="shelfToggle"><svg><use href="#i-shelf"/></svg><span>Shelf mode</span></button>
          <button class="primary" id="importTrigger" aria-haspopup="menu"><svg><use href="#i-upload"/></svg><span>Import music</span></button>
          <button class="avatar" aria-label="Profile">A</button>
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <footer class="player" id="player">
    <div class="now-playing" title="Right-click for track options">
      <div class="now-cover empty-cover"><img class="firefly-logo-static" src="assets/firefly-logo.png" alt=""></div>
      <div><strong id="nowTitle">Nothing playing</strong><span id="nowArtist">Import music to begin</span></div>
      <button class="love active" aria-label="Favorite">♥</button>
    </div>
    <div class="transport">
      <div class="transport-buttons">
        <button id="shuffleBtn"><svg><use href="#i-shuffle"/></svg></button>
        <button id="prevBtn"><svg><use href="#i-prev"/></svg></button>
        <button class="play-main" id="playBtn"><svg><use href="#i-play"/></svg></button>
        <button id="nextBtn"><svg><use href="#i-next"/></svg></button>
        <button class="repeat" id="repeatBtn" aria-label="Repeat off" title="Repeat off">↻<i>1</i></button>
      </div>
      <div class="scrub"><time id="elapsed">0:00</time><input type="range" id="progress" value="0" min="0" max="100"/><time id="duration">0:00</time></div>
    </div>
    <div class="player-tools">
      <button id="queueButton" title="View queue" aria-label="View queue" aria-expanded="false"><svg><use href="#i-list"/></svg><i class="queue-count" id="queueCount">0</i></button>
      <span class="volume"><button id="volumeMute" aria-label="Mute" title="Mute"><svg><use href="#i-volume"/></svg></button><input type="range" id="volume" value="72" min="0" max="100" aria-label="Volume"/></span>
      <button id="fullscreenBtn" title="Fullscreen player"><svg><use href="#i-expand"/></svg></button>
    </div>
  </footer>
  <audio id="audio"></audio>
  <input hidden id="audioInput" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus" multiple />
  <input hidden id="folderInput" type="file" webkitdirectory directory multiple />
  <input hidden id="screenshotInput" type="file" accept="image/*" />

  <button class="queue-backdrop" id="queueBackdrop" aria-label="Close queue" tabindex="-1"></button>
  <aside class="queue-panel" id="queuePanel" aria-hidden="true" aria-label="Playback queue">
    <header><div><span>NOW PLAYING</span><h2>Queue</h2></div><button id="closeQueue" aria-label="Close queue"><svg><use href="#i-close"/></svg></button></header>
    <div class="queue-toolbar"><span id="queueSummary">No active queue</span><button id="clearQueue">Clear</button></div>
    <div class="queue-list" id="queueList"></div>
  </aside>
  <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
  <div class="context-menu" id="contextMenu" role="menu" aria-hidden="true"></div>
  <div class="bulk-selection-bar" id="bulkSelectionBar" aria-hidden="true"></div>
  <div class="fullscreen-player" id="fullscreenPlayer" aria-hidden="true">
    <div class="fullscreen-artist-backdrop" id="fullscreenArtistBackdrop" aria-hidden="true"></div>
    <canvas id="visualizer"></canvas>
    <div class="video-stage" id="videoStage">
      <div class="generated-scene image-cover" id="generatedVideoScene"><div class="scanline"></div></div>
      <div class="online-video-host" id="onlineVideoHost"></div>
      <div class="generation-card" id="videoStatusCard"><span class="spinner"></span><div><b>Searching for an existing music video</b><small>Checking official video platforms and verified recording links</small></div></div>
    </div>
    <div class="lyrics-stage" id="lyricsStage" aria-live="polite"></div>
    <button class="close-full" id="closeFull"><svg><use href="#i-close"/></svg></button>
    <div class="full-mode"><button class="active" data-mode="visualizer">Visualizer</button><button data-mode="video">Music video</button><button data-mode="lyrics">Lyrics</button></div>
    <div class="visualizer-picker" aria-label="Visualizer style"><button class="active" data-visualizer="waves">Aurora waves</button><button data-visualizer="orbit">Pulse orbit</button><button data-visualizer="spectrum">Prism spectrum</button></div>
    <div class="full-meta"><div class="now-cover empty-cover"><img class="firefly-logo-static" src="assets/firefly-logo.png" alt=""></div><div><small>NOW PLAYING</small><h1 id="fullTitle">Nothing playing</h1><p id="fullArtist">Import music to begin</p></div></div>
    <div class="full-controls"><button id="fullPrev"><svg><use href="#i-prev"/></svg></button><button class="play-main" id="fullPlay"><svg><use href="#i-play"/></svg></button><button id="fullNext"><svg><use href="#i-next"/></svg></button></div>
  </div>
  <div class="toast-region" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
