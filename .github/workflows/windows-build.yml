name: Beta Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths-ignore:
      - updates/latest.json

permissions:
  contents: write

jobs:
  beta-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Read build metadata
        id: build
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "Ignifire-$version-Setup.exe"
          $portable = "Ignifire-$version-Portable.exe"
          $cloudServer = "Ignifire-Cloud-Server-$version.zip"
          $webPlayer = "Ignifire-Web-$version.zip"
          tar -a -cf "release/$cloudServer" -C cloud-server package.json package-lock.json .env.example README.md schema.sql src web public
          tar -a -cf "release/$webPlayer" -C web-player index.html styles.css app.js README.md
          $hash = (Get-FileHash "release/$installer" -Algorithm SHA256).Hash
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          "cloudServer=$cloudServer" >> $env:GITHUB_OUTPUT
          "webPlayer=$webPlayer" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Ignifire-Windows-Beta
          path: |
            release/${{ steps.build.outputs.installer }}
            release/${{ steps.build.outputs.portable }}
            release/${{ steps.build.outputs.cloudServer }}
            release/${{ steps.build.outputs.webPlayer }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ steps.build.outputs.version }}
          target_commitish: beta
          name: Ignifire ${{ steps.build.outputs.version }} Beta
          prerelease: true
          make_latest: false
          files: |
            release/${{ steps.build.outputs.installer }}
            release/${{ steps.build.outputs.portable }}
            release/${{ steps.build.outputs.cloudServer }}
            release/${{ steps.build.outputs.webPlayer }}
      - name: Publish beta updater manifest
        shell: pwsh
        run: |
          $manifest = Get-Content updates/latest.json | ConvertFrom-Json
          $manifest.channel = "beta"
          $manifest.branch = "beta"
          $manifest.version = "${{ steps.build.outputs.version }}"
          $manifest.publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          $manifest.downloadUrl = "https://github.com/FennXWeb/firefly-music-player/releases/download/beta-v${{ steps.build.outputs.version }}/${{ steps.build.outputs.installer }}"
          $manifest.sha256 = "${{ steps.build.outputs.sha256 }}"
          $manifest | ConvertTo-Json | Set-Content updates/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish beta updater manifest for ${{ steps.build.outputs.version }}"
            git push origin beta
          }
